[package]
name = "oxc_coverage"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[[bin]]
name = "oxc_coverage"
test = false
doctest = false

[dependencies]
cow-utils = { workspace = true }
oxc = { workspace = true, features = ["full", "isolated_declarations", "serialize", "conformance"] }
oxc_estree_tokens = { workspace = true }
oxc_lexer = { workspace = true, optional = true }
oxc_formatter = { workspace = true }
oxc_formatter_core = { workspace = true }
oxc_tasks_common = { workspace = true }
oxc_tasks_transform_checker = { workspace = true }
encoding_rs = { workspace = true }
encoding_rs_io = { workspace = true }
itertools = { workspace = true }
lazy-regex = { workspace = true }
phf = { workspace = true }
pico-args = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
saphyr = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
similar = { workspace = true }
walkdir = { workspace = true }

[features]
# Differential lexer conformance, opt-in because it is slow and `oxc_lexer` is still incubating.
# The harness runs against whichever of the lexer's three backends the build selects, and prints
# which one that was (`oxc_lexer::BACKEND`):
#
# * `avx2` (x86_64 only): RUSTFLAGS="-C target-feature=+avx2,+bmi2,+popcnt" cargo coverage --features lexer -- lexer
# * `neon` (aarch64):     cargo coverage --features lexer -- lexer
# * `scalar` fallback:    cargo coverage --features lexer -- lexer
#
# `avx2`/`bmi2`/`popcnt` are not in the x86_64 baseline on any platform, so the rustflags are required
# to reach the AVX2 core even on an x86_64 host. NEON is in the aarch64 baseline, so it needs none -
# which also means `scalar` is only reachable on an ARM host by cross-compiling. See `just ready-lexer`.
lexer = ["dep:oxc_lexer", "oxc_lexer/oxc_diagnostics"]
